<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nine Months</title>
<meta name="description" content="Nine months, one letter, a lot of love.">
<meta name="theme-color" content="#fdf2f8">
<meta property="og:title" content="Nine Months 💗">
<meta property="og:image" content="media/photo-03.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💗%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<canvas id="petals" aria-hidden="true"></canvas>

<header class="hero" id="top">
  <p class="eyebrow reveal">a little something for</p>
  <h1 class="reveal"><span class="script" id="herName">you</span></h1>
  <div class="nine reveal" aria-label="Nine months">
    <span class="nine-num">9</span>
    <span class="nine-label script">months</span>
  </div>
  <p class="tagline reveal" id="tagline"></p>
  <div class="counter reveal" id="counter" aria-live="off">
    <div><b id="cDays">0</b><span>days</span></div>
    <div><b id="cHours">0</b><span>hours</span></div>
    <div><b id="cMin">0</b><span>minutes</span></div>
    <div><b id="cSec">0</b><span>seconds</span></div>
  </div>
  <a class="scroll-hint" href="#letter" aria-label="Scroll to the letter">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </a>
</header>

<section class="letter-sec" id="letter">
  <h2 class="sec-title script reveal">A letter, just for you</h2>
  <div class="envelope-wrap reveal">
    <button class="envelope" id="envelope" aria-expanded="false" aria-controls="paper">
      <span class="env-back"></span>
      <span class="paper-peek" aria-hidden="true"></span>
      <span class="env-front"></span>
      <span class="env-flap"></span>
      <span class="seal" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.6 3 5.5 6.2 5.5c2 0 3.4 1.1 4.3 2.5.3.4.9.4 1.2 0 .9-1.4 2.3-2.5 4.3-2.5 3.2 0 5 3.1 3.7 6.3C19.5 16.4 12 21 12 21z"/></svg>
      </span>
      <span class="env-hint" id="envHint">tap to open</span>
    </button>
  </div>

  <article class="paper" id="paper" hidden>
    <div class="paper-inner">
      <p class="greeting script" id="greeting"></p>
      <div id="letterBody"></div>
      <p class="signoff" id="signoff"></p>
      <p class="signature script" id="signature"></p>
    </div>
  </article>
</section>

<section class="timeline-sec" id="months">
  <h2 class="sec-title script reveal">Nine months, nine little chapters</h2>
  <ol class="timeline" id="timeline"></ol>
</section>

<section class="gallery-sec" id="gallery">
  <h2 class="sec-title script reveal">Our little museum</h2>
  <p class="sec-sub reveal">tap anything to see it bigger</p>
  <div class="gallery" id="galleryGrid"></div>
</section>

<footer class="closing">
  <div class="big-heart" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.6 3 5.5 6.2 5.5c2 0 3.4 1.1 4.3 2.5.3.4.9.4 1.2 0 .9-1.4 2.3-2.5 4.3-2.5 3.2 0 5 3.1 3.7 6.3C19.5 16.4 12 21 12 21z"/></svg>
  </div>
  <p class="script closing-line" id="closing"></p>
  <button class="confetti-btn" id="confettiBtn">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.6 3 5.5 6.2 5.5c2 0 3.4 1.1 4.3 2.5.3.4.9.4 1.2 0 .9-1.4 2.3-2.5 4.3-2.5 3.2 0 5 3.1 3.7 6.3C19.5 16.4 12 21 12 21z"/></svg>
    shower me with love
  </button>
  <p class="made">made with love by <span id="yourName"></span></p>
</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Media viewer" hidden>
  <button class="lb-close" id="lbClose" aria-label="Close">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
  </button>
  <button class="lb-nav lb-next" id="lbNext" aria-label="Next">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
  </button>
  <figure class="lb-stage" id="lbStage"></figure>
</div>

<script src="content.js"></script>
<script src="script.js"></script>
</body>
</html>
